name: ASC Key Diagnostic

on:
  workflow_dispatch:

jobs:
  check-altool:
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Ask altool which apps the release key can see
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          mkdir -p $RUNNER_TEMP/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY" | base64 --decode \
            > $RUNNER_TEMP/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          xcrun altool --list-apps \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} 2>&1 | head -60

  check-key-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Query App Store Connect with the release API key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          pip install --quiet pyjwt cryptography requests
          echo -n "$APP_STORE_CONNECT_API_KEY" | base64 --decode > /tmp/key.p8 || echo "base64 decode FAILED"
          python3 - << 'EOF'
          import jwt, time, os, requests

          raw = os.environ["APP_STORE_CONNECT_API_KEY"]
          pem = open("/tmp/key.p8", "rb").read()
          print("secret length:", len(raw))
          print("decoded starts with PEM header:", pem.strip().startswith(b"-----BEGIN PRIVATE KEY-----"))
          print("raw secret itself looks like PEM (i.e. was NOT base64d):", raw.strip().startswith("-----BEGIN"))
          try:
              from cryptography.hazmat.primitives.serialization import load_pem_private_key
              load_pem_private_key(pem, password=None)
              print("decoded p8 parses as a private key: True")
          except Exception as e:
              print("decoded p8 parses as a private key: False —", type(e).__name__)
          print("KEY_ID length:", len(os.environ["KEY_ID"]), "(expect 10)")
          iss = os.environ["ISSUER_ID"]
          print("ISSUER_ID length:", len(iss), "(expect 36, UUID with dashes)")

          token = jwt.encode(
              {"iss": os.environ["ISSUER_ID"], "iat": int(time.time()),
               "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"},
              open("/tmp/key.p8").read(), algorithm="ES256",
              headers={"kid": os.environ["KEY_ID"]})
          h = {"Authorization": f"Bearer {token}"}

          r = requests.get("https://api.appstoreconnect.apple.com/v1/apps?limit=200", headers=h)
          print("GET /v1/apps ->", r.status_code)
          if r.ok:
              for a in r.json()["data"]:
                  print("  app:", a["id"], a["attributes"]["bundleId"], "-", a["attributes"]["name"])
          else:
              print("error body:", r.text.replace("\n", " ")[:1500])

          r = requests.get("https://api.appstoreconnect.apple.com/v1/apps/6759270803", headers=h)
          print("GET /v1/apps/6759270803 ->", r.status_code)
          if not r.ok:
              print(r.text[:2000])
          EOF
